name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package dependencies
        run: npm ci --ignore-scripts
      - name: Test installer
        run: npm test
      - name: Test preflight helper
        run: python -m unittest discover -s ship/tests -v
      - name: Validate packaged files
        run: npm pack --dry-run
